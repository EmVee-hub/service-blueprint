name: Cloud findings and VEX showcase
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/cloud-vex-showcase']
    paths: ['demo-cloud/**', '.github/workflows/demo-cloud-showcase.yml']
  pull_request:
    paths: ['demo-cloud/**', '.github/workflows/demo-cloud-showcase.yml']
permissions:
  contents: read
jobs:
  showcase:
    name: Azure Defender + AWS Inspector + VEX (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout shared collectors at reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: EmVee-hub/github-actions
          ref: ec6a9616baa71f9ae8703ec272507e3aa4eb6263
          path: shared-actions
          persist-credentials: false
      - name: Test collectors and VEX scope safeguards
        env:
          SHARED_ACTIONS: ${{ github.workspace }}/shared-actions
        run: |
          python3 -m unittest discover -s shared-actions/tests -p 'test_read_azure.py' -v
          python3 -m unittest discover -s shared-actions/tests -p 'test_inspector.py' -v
          python3 -m unittest discover -s demo-cloud -p 'test_*.py' -v
      - name: Showcase found CVEs and VEX before/after annotations
        run: python3 demo-cloud/showcase.py --shared shared-actions --output cloud-reports --annotations
      - name: Publish combined report with one legend
        if: always()
        run: |
          if [ -f cloud-reports/summary.md ]; then
            cat cloud-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Cloud showcase incomplete: inspect failed steps; no security verdict produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve raw findings, VEX and proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-vex-showcase
          path: cloud-reports/
          if-no-files-found: error
          retention-days: 7
