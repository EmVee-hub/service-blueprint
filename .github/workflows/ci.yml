name: Application CI and vulnerability policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legend:
    name: Legend — How to read this report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout report legend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish legend once to GitHub Actions summary
        shell: bash
        run: cat security/report-legend.md >> "$GITHUB_STEP_SUMMARY"

  build-scan:
    needs: [legend]
    # Start on hosted runners, especially for untrusted pull requests.
    # Use self-hosted only when runners are appropriately isolated.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build local image
        run: docker build --tag service-blueprint:ci-${{ github.sha }} .

      # Anchore's download action is pinned to an immutable reviewed commit.
      - name: Install Grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        id: install-grype

      # Pinned central action commit from the Vulnrichment integration PR.
      - name: Scan, apply VEX, evaluate security policy
        id: security
        uses: EmVee-hub/github-actions/actions/grype-policy-scan@0d787b9f20bc46017ac601114601e86d8c1ec4bf
        with:
          image: service-blueprint:ci-${{ github.sha }}
          vex-path: vex/openvex.json
          exposure: unknown
          mode: shadow # change to enforce only after validating real results
          grype-binary: ${{ steps.install-grype.outputs.cmd }}

      - name: Archive security assessment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vulnerability-assessment
          path: security-reports/
          if-no-files-found: warn

      # No publish or deploy step in this starter: registry and promotion
      # mechanics are organization-specific. In enforce mode, add publishing
      # only after this security step succeeds; deploy an immutable digest.
