name: Vulnerability policy showcase
# The images contain known-vulnerable packages but start no services.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/demo-policy-showcase.yml"
      - "demo-images/**"
      - "vex/openvex.json"

permissions:
  contents: read

jobs:
  legend:
    name: Legend — How to read this report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout report legend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish legend once to GitHub Actions summary
        shell: bash
        run: cat security/report-legend.md >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: [legend]
    name: "Scan: ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: log4shell-public, context: demo-images/log4shell, exposure: public}
          - {case: log4shell-internal, context: demo-images/log4shell, exposure: internal}
          - {case: react2shell-public, context: demo-images/react2shell, exposure: public}
          - {case: tomcat-spring-public, context: demo-images/tomcat-spring, exposure: public}
          - {case: library-mix-internal, context: demo-images/library-mix, exposure: internal}
          - {case: legacy-alpine-internal, context: demo-images/legacy-alpine, exposure: internal}
          - {case: minimal-scratch-internal, context: demo-images/minimal-scratch, exposure: internal}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build demo image locally (do not push or run)
        shell: bash
        run: |
          docker build --pull --tag "policy-showcase:${{ matrix.case }}-${{ github.sha }}" "${{ matrix.context }}"

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2

      - name: Scan, apply VEX, fetch CISA Vulnrichment and evaluate
        id: policy
        uses: EmVee-hub/github-actions/actions/grype-policy-scan@0d787b9f20bc46017ac601114601e86d8c1ec4bf
        with:
          image: policy-showcase:${{ matrix.case }}-${{ github.sha }}
          vex-path: vex/openvex.json
          exposure: ${{ matrix.exposure }}
          grype-binary: ${{ steps.grype.outputs.cmd }}
          mode: shadow
          report-directory: security-reports/${{ matrix.case }}

      # A real Grype/OpenVEX proof for one image. The statement is created
      # exclusively for this inert educational image, never for a service.
      - name: Create scoped demonstration VEX from the baseline Log4Shell match
        if: matrix.case == 'log4shell-public'
        shell: bash
        run: |
          python3 demo-images/vex_proof.py create \
            --baseline security-reports/log4shell-public/grype.json \
            --image "policy-showcase:${{ matrix.case }}-${{ github.sha }}" \
            --vex demo-images/generated-vex.json

      - name: Evaluate the SAME image with scoped demonstration VEX
        if: matrix.case == 'log4shell-public'
        uses: EmVee-hub/github-actions/actions/grype-policy-scan@0d787b9f20bc46017ac601114601e86d8c1ec4bf
        with:
          image: policy-showcase:${{ matrix.case }}-${{ github.sha }}
          vex-path: demo-images/generated-vex.json
          exposure: public
          grype-binary: ${{ steps.grype.outputs.cmd }}
          mode: shadow
          report-directory: security-reports/vex-proof

      - name: Assert VEX suppressed only the intended CVE and package
        if: matrix.case == 'log4shell-public'
        shell: bash
        run: |
          python3 demo-images/vex_proof.py check \
            --baseline security-reports/log4shell-public/grype.json \
            --with-vex security-reports/vex-proof/grype.json \
            --vex demo-images/generated-vex.json \
            --proof security-reports/vex-proof/proof.json
          cp demo-images/generated-vex.json security-reports/vex-proof/generated-vex.json

      - name: Upload explicit VEX before-and-after evidence
        if: always() && matrix.case == 'log4shell-public'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: showcase-vex-proof
          path: security-reports/vex-proof/
          if-no-files-found: error
          retention-days: 7

      - name: Upload individual assessment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: showcase-${{ matrix.case }}
          path: security-reports/${{ matrix.case }}/
          if-no-files-found: warn
          retention-days: 7

  compare:
    name: Compare all policy results
    runs-on: ubuntu-latest
    needs: [scan]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test VEX demonstration safeguards (offline)
        run: python3 -m unittest discover -s demo-images -p 'test_*.py' -v
      - name: Download individual reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: showcase-*
          path: showcase-results
      - name: Test report and VEX proof helpers
        run: python3 -m unittest discover -s demo-images -p 'test_*.py' -v

      - name: Generate comparison
        shell: bash
        run: |
          python3 demo-images/summarize.py showcase-results > showcase-summary.md
          cat showcase-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify VEX proof was produced
        shell: bash
        run: |
          find showcase-results/showcase-vex-proof -name proof.json -type f -print | grep -q 'proof.json'

      - name: Upload comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: showcase-comparison
          path: showcase-summary.md
          retention-days: 7
